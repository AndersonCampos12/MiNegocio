<div class="min-h-screen bg-gradient-to-br from-slate-950 via-blue-950 to-blue-800 flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">
    <div class="px-8 pt-8 pb-6 text-center">
      <div class="mx-auto w-14 h-14 rounded-2xl bg-blue-100 text-blue-600 flex items-center justify-center mb-5">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m-18 8V6a2 2 0 012-2h14a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z" /></svg>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Verifica tu cuenta</h1>
      <p class="text-sm text-gray-500 mt-2">Enviamos un código de seis dígitos a tu correo. Vence en 10 minutos.</p>
    </div>

    <div class="px-8 pb-8 space-y-5">
      @if (errorMsg) { <div class="p-3.5 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg">{{ errorMsg }}</div> }
      @if (mensaje) { <div class="p-3.5 text-sm text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg">{{ mensaje }}</div> }

      @if (!verificado) {
      <form (ngSubmit)="verificar()" class="space-y-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">Correo electrónico</label><input type="email" [(ngModel)]="email" name="email" autocomplete="email" class="w-full px-4 py-3 border border-gray-300 bg-gray-50 text-gray-900 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1.5">Código</label><input [(ngModel)]="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" class="w-full px-4 py-3 border border-gray-300 bg-gray-50 text-gray-900 text-center text-2xl tracking-[0.5em] font-bold rounded-lg outline-none focus:ring-2 focus:ring-blue-500"></div>
        <button type="submit" [disabled]="validando" class="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold rounded-lg">{{ validando ? 'Verificando...' : 'Verificar cuenta' }}</button>
      </form>
      <button (click)="reenviar()" [disabled]="reenviando" class="w-full text-sm font-semibold text-blue-600 hover:text-blue-800 disabled:opacity-60">{{ reenviando ? 'Enviando...' : 'Reenviar código' }}</button>
      } @else {
      <button (click)="irAlLogin()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg">Continuar al login</button>
      }

      <a routerLink="/login" class="block text-center text-sm text-gray-500 hover:text-gray-700">Volver al login</a>
    </div>
  </div>
</div>
